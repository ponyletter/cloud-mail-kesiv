# Copy to wrangler.production.toml (ignored), then fill in your own values.
name = "cloud-mail"
account_id = "REPLACE_WITH_ACCOUNT_ID"
main = "./worker-entry.js"
compatibility_date = "2025-06-04"
keep_vars = true
workers_dev = true
# Add your custom domain after initialization:
# routes = [{ pattern = "email.example.com", custom_domain = true, zone_id = "REPLACE_WITH_ZONE_ID" }]

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = "REPLACE_WITH_D1_ID"

[[kv_namespaces]]
binding = "kv"
id = "REPLACE_WITH_KV_ID"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail-attachments"

# Remove this binding if forwarding is not used.
[[send_email]]
name = "forward"
destination_address = "verified@example.net"

[assets]
binding = "assets"
directory = "../mail-worker/dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
domain = ["example.com"]
admin = "admin@example.com"
orm_log = false
analysis_cache = false
# First deploy stays closed until private bootstrap is complete.
setup_mode = "true"
