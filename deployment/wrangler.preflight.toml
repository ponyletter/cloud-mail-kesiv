# Only for `wrangler deploy --dry-run`. IDs below are placeholders.
# Do not deploy this configuration to production.
name = "cloud-mail-preflight"
main = "./worker-entry.js"
compatibility_date = "2025-06-04"
workers_dev = false

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-email-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail-email-attachments"

[[send_email]]
name = "forward"

[assets]
binding = "assets"
directory = "../mail-worker/dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
domain = ["example.invalid"]
admin = "admin@example.invalid"
orm_log = false
analysis_cache = false
