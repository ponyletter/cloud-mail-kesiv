name: Validate deployment tooling

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: '12.18.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked content
        run: python3 deployment/scan-secrets.py
      - name: Install locked dependencies
        run: |
          pnpm --dir mail-worker install --frozen-lockfile
          pnpm --dir mail-vue install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir mail-vue run build
      - name: Bundle protected Worker without deployment
        working-directory: mail-worker
        run: pnpm exec wrangler deploy --config ../deployment/wrangler.preflight.toml --dry-run --outdir ../deployment/build
      - name: Exercise bootstrap and ordinary-user mail paths
        run: node deployment/smoke-test.mjs
